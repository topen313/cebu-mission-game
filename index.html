<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇵🇭 宿霧隱藏任務 👾 Pixel Island</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'VT323', monospace;
      letter-spacing: 0.5px;
    }
    .pixel-font-title {
      font-family: 'Press Start 2P', cursive;
    }
    .pixel-box {
      border: 4px solid #1e293b;
      box-shadow: 4px 4px 0px #1e293b;
    }
    .pixel-box-sm {
      border: 3px solid #1e293b;
      box-shadow: 3px 3px 0px #1e293b;
    }
    .pixel-btn {
      border: 3px solid #1e293b;
      box-shadow: 0px 4px 0px #1e293b;
      transition: all 0.1s ease;
    }
    .pixel-btn:active {
      transform: translateY(4px);
      box-shadow: 0px 0px 0px #1e293b;
    }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-sky-200 text-slate-800 min-h-screen flex flex-col items-center p-4">

  <!-- 像素海島標頭 -->
  <header class="text-center my-3">
    <div class="inline-block bg-amber-300 px-3 py-1 pixel-box mb-2">
      <span class="text-xs text-amber-900 font-bold tracking-widest">CEBU TRIP 2026</span>
    </div>
    <h1 class="text-xl md:text-2xl font-bold text-sky-900 pixel-font-title tracking-wider drop-shadow">CEBU MISSION</h1>
    <p class="text-base text-sky-800 font-bold mt-1">🏝️ 到底誰才是那個怪怪的？ 🕵️‍♀️</p>
  </header>

  <main class="w-full max-w-md flex-1 flex flex-col gap-4">

    <!-- 1. 玩家暱稱與抽卡按鈕 -->
    <div class="bg-amber-100 p-4 rounded-none pixel-box space-y-3">
      <div>
        <label class="block text-sm font-bold text-amber-900 mb-1">🎮 你的暱稱：</label>
        <input type="text" id="playerName" placeholder="例如：小明" class="w-full bg-white border-2 border-slate-800 p-2 text-base text-slate-800 focus:outline-none focus:bg-amber-50">
      </div>

      <button id="drawBtn" onclick="drawThreeCandidates()" class="pixel-btn w-full bg-orange-400 hover:bg-orange-300 text-slate-950 font-bold py-3 text-lg">
        🎴 隨機抽取 3 張候選任務
      </button>
    </div>

    <!-- 2. 3 選 1 候選卡片區 -->
    <div id="candidateSection" class="hidden flex-col gap-3">
      <div class="text-xs text-amber-900 font-bold text-center bg-amber-300 py-1.5 border-2 border-slate-800 pixel-box-sm">
        👉 請翻牌預覽，並選擇【1 個】你今天要做出的任務：
      </div>
      
      <!-- 候選卡 1 -->
      <div id="card1" class="perspective-1000 cursor-pointer h-36">
        <div id="inner1" onclick="toggleFlip(1)" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-none pixel-box-sm">
          <div class="absolute inset-0 bg-sky-400 flex flex-col items-center justify-center border-2 border-white backface-hidden">
            <span class="text-2xl mb-1">❓</span><span class="font-bold text-sm text-sky-950">候選任務 A（點擊翻面）</span>
          </div>
          <div class="absolute inset-0 bg-amber-50 p-3 flex flex-col justify-between rotate-y-180 backface-hidden">
            <div class="flex justify-between items-center">
              <span id="cat1" class="text-xs font-bold text-sky-900 bg-sky-200 px-1.5 py-0.5 border border-sky-400"></span>
              <button onclick="selectTask(0, event)" class="pixel-btn text-xs bg-emerald-400 hover:bg-emerald-300 text-slate-950 px-2 py-1 font-bold">✅ 決定選這張</button>
            </div>
            <p id="text1" class="text-sm font-bold text-slate-800 leading-snug"></p>
            <span class="text-xs text-slate-400 text-right">再次點擊翻回</span>
          </div>
        </div>
      </div>

      <!-- 候選卡 2 -->
      <div id="card2" class="perspective-1000 cursor-pointer h-36">
        <div id="inner2" onclick="toggleFlip(2)" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-none pixel-box-sm">
          <div class="absolute inset-0 bg-teal-400 flex flex-col items-center justify-center border-2 border-white backface-hidden">
            <span class="text-2xl mb-1">❓</span><span class="font-bold text-sm text-teal-950">候選任務 B（點擊翻面）</span>
          </div>
          <div class="absolute inset-0 bg-amber-50 p-3 flex flex-col justify-between rotate-y-180 backface-hidden">
            <div class="flex justify-between items-center">
              <span id="cat2" class="text-xs font-bold text-teal-900 bg-teal-200 px-1.5 py-0.5 border border-teal-400"></span>
              <button onclick="selectTask(1, event)" class="pixel-btn text-xs bg-emerald-400 hover:bg-emerald-300 text-slate-950 px-2 py-1 font-bold">✅ 決定選這張</button>
            </div>
            <p id="text2" class="text-sm font-bold text-slate-800 leading-snug"></p>
            <span class="text-xs text-slate-400 text-right">再次點擊翻回</span>
          </div>
        </div>
      </div>

      <!-- 候選卡 3 -->
      <div id="card3" class="perspective-1000 cursor-pointer h-36">
        <div id="inner3" onclick="toggleFlip(3)" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-none pixel-box-sm">
          <div class="absolute inset-0 bg-amber-400 flex flex-col items-center justify-center border-2 border-white backface-hidden">
            <span class="text-2xl mb-1">❓</span><span class="font-bold text-sm text-amber-950">候選任務 C（點擊翻面）</span>
          </div>
          <div class="absolute inset-0 bg-amber-50 p-3 flex flex-col justify-between rotate-y-180 backface-hidden">
            <div class="flex justify-between items-center">
              <span id="cat3" class="text-xs font-bold text-amber-900 bg-amber-200 px-1.5 py-0.5 border border-amber-400"></span>
              <button onclick="selectTask(2, event)" class="pixel-btn text-xs bg-emerald-400 hover:bg-emerald-300 text-slate-950 px-2 py-1 font-bold">✅ 決定選這張</button>
            </div>
            <p id="text3" class="text-sm font-bold text-slate-800 leading-snug"></p>
            <span class="text-xs text-slate-400 text-right">再次點擊翻回</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. 已確定的今日唯一任務卡 -->
    <div id="finalSection" class="hidden flex-col gap-2">
      <div class="text-xs text-emerald-900 font-bold text-center bg-emerald-300 py-1.5 border-2 border-slate-800 pixel-box-sm">
        🔒 今日隱藏任務已鎖定（其餘卡片已拿掉）
      </div>

      <div class="perspective-1000 cursor-pointer h-36">
        <div id="innerFinal" onclick="toggleFinalFlip()" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-none pixel-box-sm">
          <div class="absolute inset-0 bg-emerald-400 flex flex-col items-center justify-center border-2 border-white backface-hidden">
            <span class="text-2xl mb-1">🎁</span><span class="font-bold text-base text-emerald-950">今日個人任務（點擊看防窺內容）</span>
          </div>
          <div class="absolute inset-0 bg-amber-50 p-3 flex flex-col justify-between rotate-y-180 backface-hidden">
            <span id="finalCat" class="text-xs font-bold text-emerald-800 bg-emerald-200 px-2 py-0.5 border border-emerald-400 w-fit"></span>
            <p id="finalText" class="text-base font-bold text-slate-800 leading-snug"></p>
            <span class="text-xs text-slate-400 text-right">再次點擊隱藏</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. 懷疑筆記本 -->
    <div class="bg-amber-100 p-4 rounded-none pixel-box space-y-2">
      <h2 class="text-sm font-bold text-amber-900 flex justify-between items-center">
        <span>🕵️‍♂️ 懷疑筆記本 (極密)</span>
        <span class="text-xs text-amber-700 font-normal">僅存於本機</span>
      </h2>
      <textarea id="notes" placeholder="記錄你覺得誰剛剛怪怪的、做了什麼事（晚餐揭曉指認用）..." class="w-full h-24 bg-white border-2 border-slate-800 p-2 text-sm text-slate-800 focus:outline-none focus:bg-amber-50 resize-none"></textarea>
    </div>

    <!-- 5. 晚餐揭曉區 -->
    <div class="bg-white p-4 rounded-none pixel-box space-y-3">
      <h2 class="text-sm font-bold text-slate-800">🌙 晚餐大揭曉時間</h2>
      <button onclick="revealMyMission()" class="pixel-btn w-full bg-rose-500 hover:bg-rose-400 text-white font-bold py-2.5 text-base">📢 揭曉我的任務 (秀給全團看)</button>
      <div id="revealResultArea" class="hidden bg-amber-50 p-3 text-sm space-y-2 border-2 border-slate-800"></div>
    </div>

  </main>

  <script>
    const taskDatabase = [
      { cat: "🚐 移動組", text: "1. 安全帶糾察隊：上車提醒大家：「安全帶要繫喔，宿務抓很嚴。」整天 3 次。" },
      { cat: "🚐 移動組", text: "2. 窗邊沉思者：坐車把額頭靠在車窗玻璃上維持 30 秒，假裝拍文青 MV。" },
      { cat: "🚐 移動組", text: "3. 假裝暈車：問旁邊有沒有綠油精或薄荷棒，1 分鐘後恢復正常，整天 2 次。" },
      { cat: "🚐 移動組", text: "4. 路況分析師：煞車就搖頭說：「宿務這條路塞車真的無解。」整天 3 次。" },
      { cat: "🚐 移動組", text: "5. 時間確認狂：每隔兩三小時問身邊的人現在幾點，不能看手機，問滿 3 次。" },
      { cat: "🚐 移動組", text: "6. 冷氣狂熱者：上車調出風口問大家：「你那邊有風嗎？會不會熱？」至少 3 次。" },
      { cat: "🚐 移動組", text: "7. 點名狂人：景點結束上車後大喊：「來！報數！」要求大家報數，至少 2 次。" },
      { cat: "🌊 海灘組", text: "8. 檢查大師：準備下水或穿救生衣時檢查身邊的人說：「這樣比較安全。」至少 2 次。" },
      { cat: "🌊 海灘組", text: "9. 海水鑑價師：碰到海水用手指沾一下認真說：「今天的海水分外地鹹耶。」講 3 次。" },
      { cat: "🌊 海灘組", text: "10. 吹風少年：吹到海風時閉眼深呼吸感嘆：「這就是度假的味道啊...」講滿 3 次。" },
      { cat: "🌊 海灘組", text: "11. 拖鞋糾察隊：關心身邊人的腳：「你鞋子有沒有進沙？要不要我幫你吹一下？」至少 3 人。" },
      { cat: "🌊 海灘組", text: "12. 水性宣示：看到海時拍胸口說：「不瞞你說，我以前外號叫宿務小白鯊。」" },
      { cat: "🍽️ 餐廳組", text: "13. 遞紙巾達人：上菜或有人手沾到時，主動遞衛生紙，整天 5 次。" },
      { cat: "🍽️ 餐廳組", text: "14. 美食讚賞家：每道菜吃第一口點頭小聲說：「嗯，這個點對了。」" },
      { cat: "🍽️ 餐廳組", text: "15. 剩最後一口：大盤食物剩最後一口時熱情分配：「這口給你，這精華。」" },
      { cat: "🍽️ 餐廳組", text: "16. 芒果乾代言人：吃到芒果相關食物閉眼點頭英文說：「Oh my god, this is real Cebu!」3 次。" },
      { cat: "🍽️ 餐廳組", text: "17. 美食攝影師：菜上齊站起來用超刁鑽姿勢拍菜，拍完說：「完美。」" },
      { cat: "🗿 散步組", text: "18. 當地人認證：看到當地人小聲說：「你不覺得他長得有點像我認識的某個人嗎？」3 次。" },
      { cat: "🗿 散步組", text: "19. 台灣比較級：看到建築自然說：「這感覺跟台灣的阿嬤家有點像。」3 次。" },
      { cat: "🗿 散步組", text: "20. 店員擊掌：結帳後自然跟店員碰拳/擊掌並說：「Thank you。」" }
    ];

    let candidateTasks = [];
    let selectedTask = null;

    window.onload = () => {
      const savedSelected = localStorage.getItem('cebu_selected_task');
      const savedNotes = localStorage.getItem('cebu_notes');
      const savedName = localStorage.getItem('cebu_player_name');
      
      if (savedName) document.getElementById('playerName').value = savedName;
      if (savedNotes) document.getElementById('notes').value = savedNotes;

      if (savedSelected) {
        selectedTask = JSON.parse(savedSelected);
        showFinalTask();
      }
    };

    document.getElementById('notes').addEventListener('input', (e) => {
      localStorage.setItem('cebu_notes', e.target.value);
    });

    function drawThreeCandidates() {
      const name = document.getElementById('playerName').value.trim();
      if (!name) return alert('請先輸入暱稱喔！');
      localStorage.setItem('cebu_player_name', name);

      if (selectedTask && !confirm('你已經有選定的任務了，重新抽取會覆蓋原本的任務，確定要重抽嗎？')) return;

      // 隨機取出 3 個不重複的候選任務
      candidateTasks = [...taskDatabase].sort(() => 0.5 - Math.random()).slice(0, 3);
      
      // 顯示候選區、隱藏已選區
      document.getElementById('candidateSection').classList.remove('hidden');
      document.getElementById('candidateSection').classList.add('flex');
      document.getElementById('finalSection').classList.add('hidden');
      document.getElementById('finalSection').classList.remove('flex');

      candidateTasks.forEach((t, i) => {
        const idx = i + 1;
        document.getElementById(`cat${idx}`).innerText = t.cat;
        document.getElementById(`text${idx}`).innerText = t.text;
        // 恢復正面
        document.getElementById(`inner${idx}`).classList.remove('rotate-y-180');
      });
    }

    function toggleFlip(index) {
      document.getElementById(`inner${index}`).classList.toggle('rotate-y-180');
    }

    function selectTask(index, event) {
      event.stopPropagation(); // 阻止觸發卡片翻面
      selectedTask = candidateTasks[index];
      localStorage.setItem('cebu_selected_task', JSON.stringify(selectedTask));
      
      // 隱藏 3 個候選卡片，呈現最終選定的卡片
      showFinalTask();
    }

    function showFinalTask() {
      document.getElementById('candidateSection').classList.add('hidden');
      document.getElementById('candidateSection').classList.remove('flex');
      
      document.getElementById('finalSection').classList.remove('hidden');
      document.getElementById('finalSection').classList.add('flex');

      document.getElementById('finalCat').innerText = selectedTask.cat;
      document.getElementById('finalText').innerText = selectedTask.text;
      document.getElementById('innerFinal').classList.remove('rotate-y-180');
    }

    function toggleFinalFlip() {
      document.getElementById('innerFinal').classList.toggle('rotate-y-180');
    }

    function revealMyMission() {
      if (!selectedTask) return alert('你還沒選擇今天的任務喔！');
      const name = document.getElementById('playerName').value.trim() || '我';
      const area = document.getElementById('revealResultArea');
      area.classList.remove('hidden');
      area.innerHTML = `
        <div class="font-bold text-rose-700 text-base mb-1">🎭 ${name} 的今日隱藏任務：</div>
        <div class="text-slate-900 font-bold bg-amber-100 p-2 border border-amber-300">
          <span class="text-xs text-amber-800 bg-amber-200 px-1 py-0.5 border border-amber-400 font-bold mr-1">${selectedTask.cat}</span>
          ${selectedTask.text}
        </div>
      `;
    }
  </script>
</body>
</html>
