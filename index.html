<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇵🇭 宿霧隱藏任務 👾 Pixel Island (即時連線版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  
  <!-- 引入 Firebase 相容 SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'VT323', monospace; letter-spacing: 0.5px; }
    .pixel-font-title { font-family: 'Press Start 2P', cursive; }
    .pixel-box { border: 4px solid #1e293b; box-shadow: 4px 4px 0px #1e293b; }
    .pixel-box-sm { border: 3px solid #1e293b; box-shadow: 3px 3px 0px #1e293b; }
    .pixel-btn { border: 3px solid #1e293b; box-shadow: 0px 4px 0px #1e293b; transition: all 0.1s ease; }
    .pixel-btn:active { transform: translateY(4px); box-shadow: 0px 0px 0px #1e293b; }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-sky-200 text-slate-800 min-h-screen flex flex-col items-center p-4">

  <!-- 像素海島標頭 -->
  <header class="text-center my-3">
    <div class="inline-block bg-amber-300 px-3 py-1 pixel-box mb-2">
      <span class="text-xs text-amber-900 font-bold tracking-widest">CEBU TRIP 2026</span>
    </div>
    <h1 class="text-xl md:text-2xl font-bold text-sky-900 pixel-font-title tracking-wider drop-shadow">CEBU MISSION</h1>
    <p class="text-base text-sky-800 font-bold mt-1">🏝️ 8人專屬・網頁即時同步進度戰 🕵️‍♀️</p>
  </header>

  <main class="w-full max-w-md flex-1 flex flex-col gap-4">

    <!-- 1. 玩家設定 -->
    <div class="bg-amber-100 p-4 rounded-none pixel-box space-y-3">
      <div class="grid grid-cols-3 gap-2">
        <div class="col-span-2">
          <label class="block text-xs font-bold text-amber-900 mb-1">🎮 你的暱稱：</label>
          <input type="text" id="playerName" placeholder="例如：小明" class="w-full bg-white border-2 border-slate-800 p-1.5 text-base text-slate-800 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-amber-900 mb-1">🔢 玩家編號：</label>
          <select id="playerNo" class="w-full bg-white border-2 border-slate-800 p-1.5 text-base font-bold text-slate-800 focus:outline-none">
            <option value="1">玩家 1</option>
            <option value="2">玩家 2</option>
            <option value="3">玩家 3</option>
            <option value="4">玩家 4</option>
            <option value="5">玩家 5</option>
            <option value="6">玩家 6</option>
            <option value="7">玩家 7</option>
            <option value="8">玩家 8</option>
          </select>
        </div>
      </div>

      <button id="drawBtn" onclick="drawThreeCandidates()" class="pixel-btn w-full bg-orange-400 hover:bg-orange-300 text-slate-950 font-bold py-2.5 text-base">
        🎴 取得今日不撞牌 3 大任務
      </button>
    </div>

    <!-- 2. 3 選 1 候選卡片區 -->
    <div id="candidateSection" class="hidden flex-col gap-3">
      <div class="text-xs text-amber-900 font-bold text-center bg-amber-300 py-1 border-2 border-slate-800 pixel-box-sm">
        👉 點擊翻牌，選擇【1 個】你今天要做出的任務：
      </div>
      
      <!-- 卡片 A -->
      <div class="perspective-1000 cursor-pointer h-36">
        <div id="inner1" onclick="toggleFlip(1)" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-none pixel-box-sm">
          <div class="absolute inset-0 bg-sky-400 flex flex-col items-center justify-center border-2 border-white backface-hidden">
            <span class="text-2xl mb-1">❓</span><span class="font-bold text-sm text-sky-950">候選 A（點擊翻面）</span>
          </div>
          <div class="absolute inset-0 bg-amber-50 p-3 flex flex-col justify-between rotate-y-180 backface-hidden">
            <div class="flex justify-between items-center">
              <span id="cat1" class="text-xs font-bold text-sky-900 bg-sky-200 px-1.5 py-0.5 border border-sky-400"></span>
              <button onclick="selectTask(0, event)" class="pixel-btn text-xs bg-emerald-400 text-slate-950 px-2 py-1 font-bold">✅ 決定選這張</button>
            </div>
            <p id="text1" class="text-sm font-bold text-slate-800 leading-snug"></p>
            <span class="text-xs text-slate-400 text-right">再次點擊翻回</span>
          </div>
        </div>
      </div>

      <!-- 卡片 B -->
      <div class="perspective-1000 cursor-pointer h-36">
        <div id="inner2" onclick="toggleFlip(2)" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-none pixel-box-sm">
          <div class="absolute inset-0 bg-teal-400 flex flex-col items-center justify-center border-2 border-white backface-hidden">
            <span class="text-2xl mb-1">❓</span><span class="font-bold text-sm text-teal-950">候選 B（點擊翻面）</span>
          </div>
          <div class="absolute inset-0 bg-amber-50 p-3 flex flex-col justify-between rotate-y-180 backface-hidden">
            <div class="flex justify-between items-center">
              <span id="cat2" class="text-xs font-bold text-teal-900 bg-teal-200 px-1.5 py-0.5 border border-teal-400"></span>
              <button onclick="selectTask(1, event)" class="pixel-btn text-xs bg-emerald-400 text-slate-950 px-2 py-1 font-bold">✅ 決定選這張</button>
            </div>
            <p id="text2" class="text-sm font-bold text-slate-800 leading-snug"></p>
            <span class="text-xs text-slate-400 text-right">再次點擊翻回</span>
          </div>
        </div>
      </div>

      <!-- 卡片 C -->
      <div class="perspective-1000 cursor-pointer h-36">
        <div id="inner3" onclick="toggleFlip(3)" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-none pixel-box-sm">
          <div class="absolute inset-0 bg-amber-400 flex flex-col items-center justify-center border-2 border-white backface-hidden">
            <span class="text-2xl mb-1">❓</span><span class="font-bold text-sm text-amber-950">候選 C（點擊翻面）</span>
          </div>
          <div class="absolute inset-0 bg-amber-50 p-3 flex flex-col justify-between rotate-y-180 backface-hidden">
            <div class="flex justify-between items-center">
              <span id="cat3" class="text-xs font-bold text-amber-900 bg-amber-200 px-1.5 py-0.5 border border-amber-400"></span>
              <button onclick="selectTask(2, event)" class="pixel-btn text-xs bg-emerald-400 text-slate-950 px-2 py-1 font-bold">✅ 決定選這張</button>
            </div>
            <p id="text3" class="text-sm font-bold text-slate-800 leading-snug"></p>
            <span class="text-xs text-slate-400 text-right">再次點擊翻回</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. 已確定的今日任務卡 (含 4 次打勾追蹤) -->
    <div id="finalSection" class="hidden flex-col gap-2">
      <div class="text-xs text-emerald-900 font-bold text-center bg-emerald-300 py-1 border-2 border-slate-800 pixel-box-sm">
        🔒 今日任務已鎖定（打勾後，全團網頁會即時同步你的進度！）
      </div>

      <div class="perspective-1000 cursor-pointer h-44">
        <div id="innerFinal" onclick="toggleFinalFlip()" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-none pixel-box-sm">
          <div class="absolute inset-0 bg-emerald-400 flex flex-col items-center justify-center border-2 border-white backface-hidden">
            <span class="text-2xl mb-1">🎁</span><span class="font-bold text-base text-emerald-950">今日個人任務（點擊看防窺內容）</span>
          </div>
          <div class="absolute inset-0 bg-amber-50 p-3 flex flex-col justify-between rotate-y-180 backface-hidden">
            <div class="flex justify-between items-center">
              <span id="finalCat" class="text-xs font-bold text-emerald-800 bg-emerald-200 px-2 py-0.5 border border-emerald-400"></span>
              <span id="stepCounterText" class="text-xs font-bold text-emerald-700 bg-white px-1.5 py-0.5 border border-emerald-400">進度: 0/4</span>
            </div>
            <p id="finalText" class="text-sm font-bold text-slate-800 leading-snug"></p>

            <!-- 4 次打勾核取區 -->
            <div class="bg-amber-100 p-1.5 border border-amber-300 flex justify-between items-center" onclick="event.stopPropagation()">
              <span class="text-xs font-bold text-amber-900">完成次數打勾：</span>
              <div class="flex gap-1.5">
                <label class="flex items-center gap-0.5 text-xs font-bold"><input type="checkbox" id="chk1" onchange="updateCheckProgress()" class="w-4 h-4">1</label>
                <label class="flex items-center gap-0.5 text-xs font-bold"><input type="checkbox" id="chk2" onchange="updateCheckProgress()" class="w-4 h-4">2</label>
                <label class="flex items-center gap-0.5 text-xs font-bold"><input type="checkbox" id="chk3" onchange="updateCheckProgress()" class="w-4 h-4">3</label>
                <label class="flex items-center gap-0.5 text-xs font-bold"><input type="checkbox" id="chk4" onchange="updateCheckProgress()" class="w-4 h-4">4</label>
              </div>
            </div>

            <span class="text-xs text-slate-400 text-right">再次點擊隱藏</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 4. 全團網頁即時同步雷達看板 -->
    <div class="bg-sky-100 p-4 rounded-none pixel-box space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-sky-900">📡 全團網頁即時進度雷達</h2>
        <span class="text-xs text-emerald-700 bg-emerald-100 px-2 py-0.5 border border-emerald-400 font-bold">🟢 連線中</span>
      </div>

      <div id="groupProgressList" class="bg-white p-2 border-2 border-slate-800 text-xs space-y-1.5 max-h-48 overflow-y-auto">
        <div class="text-slate-400 text-center py-2 font-bold">載入連線中或尚未有人打勾進度...</div>
      </div>
    </div>

    <!-- 5. 懷疑筆記本 -->
    <div class="bg-amber-100 p-4 rounded-none pixel-box space-y-2">
      <h2 class="text-sm font-bold text-amber-900 flex justify-between items-center">
        <span>🕵️‍♂️ 懷疑筆記本 (極密)</span>
        <button onclick="clearNotes()" class="text-xs text-rose-700 font-bold underline">清空筆記</button>
      </h2>
      <textarea id="notes" placeholder="記錄你覺得誰剛剛怪怪的、做了什麼事（晚餐揭曉指認用）..." class="w-full h-20 bg-white border-2 border-slate-800 p-2 text-sm text-slate-800 focus:outline-none focus:bg-amber-50 resize-none"></textarea>
    </div>

    <!-- 6. 晚餐揭曉區 -->
    <div class="bg-white p-4 rounded-none pixel-box space-y-3">
      <h2 class="text-sm font-bold text-slate-800">🌙 晚餐揭曉與重置</h2>
      <button onclick="revealMyMission()" class="pixel-btn w-full bg-rose-500 hover:bg-rose-400 text-white font-bold py-2.5 text-base">📢 揭曉我的任務 (秀給全團看)</button>
      <div id="revealResultArea" class="hidden bg-amber-50 p-3 text-sm space-y-2 border-2 border-slate-800"></div>
      
      <button onclick="resetDay()" class="pixel-btn w-full bg-slate-300 hover:bg-slate-200 text-slate-800 font-bold py-1.5 text-xs">☀️ 重置準備下一天任務</button>
    </div>

  </main>

      { cat: "🗿 散步組", text: "36. 宿務超模：走到好看背景前把手機交給朋友，不說明原因，立刻擺超浮誇 Vogue 姿勢 5 秒，擺滿 4 次。" },
      { cat: "🗿 散步組", text: "37. 歷史狂熱分子：看到古蹟或舊牆壁時，湊近瞇眼說：「嗯……這個石頭至少有三百年歷史。」講滿 4 次。" },
      { cat: "🗿 散步組", text: "38. 拍照指導師：幫朋友拍照時，大聲下指令：「來，頭再斜 15 度！完美！」指導 4 次。" },
      { cat: "🗿 散步組", text: "39. 陽光美男/美女：走在路上伸手擋陽光，看著天空感嘆：「宿務的陽光真的好熱情啊。」感嘆 4 次。" },
      { cat: "🗿 散步組", text: "40. 同款搜尋器：在土產店看到任何東西，拿起來問朋友：「你不覺得這個很適合你嗎？」問滿 4 次。" }
    ];

    let candidateTasks = [];
    let selectedTask = null;

    window.onload = () => {
      const savedSelected = localStorage.getItem('cebu_selected_task');
      const savedNotes = localStorage.getItem('cebu_notes');
      const savedName = localStorage.getItem('cebu_player_name');
      const savedNo = localStorage.getItem('cebu_player_no');
      
      if (savedName) document.getElementById('playerName').value = savedName;
      if (savedNo) document.getElementById('playerNo').value = savedNo;
      if (savedNotes) document.getElementById('notes').value = savedNotes;

      if (savedSelected) {
        selectedTask = JSON.parse(savedSelected);
        showFinalTask();
        loadChecks();
      }

      // 監聽全團進度（即時連線）
      progressRef.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        renderGroupProgress(data);
      });
    };

    document.getElementById('notes').addEventListener('input', (e) => {
      localStorage.setItem('cebu_notes', e.target.value);
    });

    function drawThreeCandidates() {
      const name = document.getElementById('playerName').value.trim();
      if (!name) return alert('請先輸入暱稱喔！');
      
      const pNo = parseInt(document.getElementById('playerNo').value);
      localStorage.setItem('cebu_player_name', name);
      localStorage.setItem('cebu_player_no', pNo);

      if (selectedTask && !confirm('你已經有選定的任務了，重新抽取會覆蓋原本任務，確定嗎？')) return;

      const offset = (pNo - 1) * 5;
      candidateTasks = [
        taskDatabase[offset % taskDatabase.length],
        taskDatabase[(offset + 1) % taskDatabase.length],
        taskDatabase[(offset + 2) % taskDatabase.length]
      ];
      
      document.getElementById('candidateSection').classList.remove('hidden');
      document.getElementById('candidateSection').classList.add('flex');
      document.getElementById('finalSection').classList.add('hidden');
      document.getElementById('finalSection').classList.remove('flex');

      candidateTasks.forEach((t, i) => {
        const idx = i + 1;
        document.getElementById(`cat${idx}`).innerText = t.cat;
        document.getElementById(`text${idx}`).innerText = t.text;
        document.getElementById(`inner${idx}`).classList.remove('rotate-y-180');
      });
    }

    function toggleFlip(index) {
      document.getElementById(`inner${index}`).classList.toggle('rotate-y-180');
    }

    function selectTask(index, event) {
      event.stopPropagation();
      if (!confirm('確定要選擇這個任務嗎？選擇後其他卡片將會銷毀！')) return;
      
      selectedTask = candidateTasks[index];
      localStorage.setItem('cebu_selected_task', JSON.stringify(selectedTask));
      resetChecks();
      showFinalTask();
    }

    function showFinalTask() {
      document.getElementById('candidateSection').classList.add('hidden');
      document.getElementById('candidateSection').classList.remove('flex');
      
      document.getElementById('finalSection').classList.remove('hidden');
      document.getElementById('finalSection').classList.add('flex');

      document.getElementById('finalCat').innerText = selectedTask.cat;
      document.getElementById('finalText').innerText = selectedTask.text;
      document.getElementById('innerFinal').classList.remove('rotate-y-180');
      updateCheckProgress();
    }

    function toggleFinalFlip() {
      document.getElementById('innerFinal').classList.toggle('rotate-y-180');
    }

    function updateCheckProgress() {
      let count = 0;
      for (let i = 1; i <= 4; i++) {
        if (document.getElementById(`chk${i}`).checked) count++;
      }
      document.getElementById('stepCounterText').innerText = `進度: ${count}/4`;
      
      // 儲存本地打勾狀態
      const checks = [
        document.getElementById('chk1').checked,
        document.getElementById('chk2').checked,
        document.getElementById('chk3').checked,
        document.getElementById('chk4').checked
      ];
      localStorage.setItem('cebu_task_checks', JSON.stringify(checks));

      // 即時同步至 Firebase 資料庫 (所有人畫面上會直接變更)
      const name = document.getElementById('playerName').value.trim();
      if (name) {
        progressRef.child(name).set({
          progress: `${count}/4`,
          updatedAt: Date.now()
        });
      }
    }

    function loadChecks() {
      const saved = localStorage.getItem('cebu_task_checks');
      if (saved) {
        const checks = JSON.parse(saved);
        for (let i = 1; i <= 4; i++) {
          document.getElementById(`chk${i}`).checked = checks[i - 1] || false;
        }
        updateCheckProgress();
      }
    }

    function resetChecks() {
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`chk${i}`).checked = false;
      }
      localStorage.removeItem('cebu_task_checks');
      updateCheckProgress();
    }

    function renderGroupProgress(data) {
      const container = document.getElementById('groupProgressList');
      const keys = Object.keys(data);
      
      if (keys.length === 0) {
        container.innerHTML = `<div class="text-slate-400 text-center py-2 font-bold">尚無玩家連線打勾...</div>`;
        return;
      }

      container.innerHTML = keys.map(name => {
        const val = data[name].progress;
        const isDone = val === '4/4';
        return `
          <div class="flex justify-between items-center bg-sky-50 p-1.5 border border-sky-200 font-bold">
            <span class="text-sky-900">👤 ${name}</span>
            <span class="${isDone ? 'text-emerald-600 font-extrabold' : 'text-amber-600'}">
              ${isDone ? '🎉 任務達成 (4/4)' : '⏳ 進度: ' + val}
            </span>
          </div>
        `;
      }).join('');
    }

    function clearNotes() {
      if (confirm('確定要清空今天的懷疑筆記嗎？')) {
        document.getElementById('notes').value = '';
        localStorage.removeItem('cebu_notes');
      }
    }

    function resetDay() {
      if (confirm('確定要重置並準備下一天的任務嗎？')) {
        selectedTask = null;
        localStorage.removeItem('cebu_selected_task');
        resetChecks();
        document.getElementById('finalSection').classList.add('hidden');
        document.getElementById('finalSection').classList.remove('flex');
        document.getElementById('revealResultArea').classList.add('hidden');
        alert('已重置！明天請重新選擇玩家編號並抽取任務。');
      }
    }

    function revealMyMission() {
      if (!selectedTask) return alert('你還沒選擇今天的任務喔！');
      const name = document.getElementById('playerName').value.trim() || '我';
      let count = 0;
      for (let i = 1; i <= 4; i++) {
        if (document.getElementById(`chk${i}`).checked) count++;
      }
      
      const area = document.getElementById('revealResultArea');
      area.classList.remove('hidden');
      area.innerHTML = `
        <div class="font-bold text-rose-700 text-base mb-1">🎭 ${name} 的今日隱藏任務：</div>
        <div class="text-slate-900 font-bold bg-amber-100 p-2 border border-amber-300 space-y-1">
          <div>
            <span class="text-xs text-amber-800 bg-amber-200 px-1 py-0.5 border border-amber-400 font-bold mr-1">${selectedTask.cat}</span>
          </div>
          <div>${selectedTask.text}</div>
          <div class="text-xs ${count === 4 ? 'text-emerald-700' : 'text-amber-800'} font-bold border-t border-amber-300 pt-1">
            最終達成率：${count} / 4 ${count === 4 ? '（完全成功！🎉）' : ''}
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
